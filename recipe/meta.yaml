{% set name = "sbmlmath" %}
{% set version = "0.5.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/sbmlmath-{{ version }}.tar.gz
  sha256: 0f2669bfb2debe865f67832cd83907657855b8d4fe69b65462e25ccc19e4dfbb

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=64
    - setuptools-scm >=8
    - pip
  run:
    - python >={{ python_min }}
    - python-libsbml >=5.20.4
    - sympy
    - pint
    - lxml >=4.6.4

test:
  imports:
    - sbmlmath
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/dweindl/sbmlmath
  summary: SBML Math <-> SymPy
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - kaiserls
    - dweindl
